repos:
  - repo: local
    hooks:
      - id: build-dist
        name: Build static site
        entry: bun run build
        language: system
        files: '^(index\.html|src/.*\.ts|scripts/.*\.ts|data/.*\.json|posts/.*\.typ|package\.json|tsconfig\.json)$'
        pass_filenames: false
        stages: [pre-commit]
